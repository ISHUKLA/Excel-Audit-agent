name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v -rsx -p no:cacheprovider

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [secret-scan, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t excel-audit-agent:ci .

      - name: Smoke test — container startup
        run: |
          set -uo pipefail

          cleanup() {
            docker logs test-container || true
            docker stop test-container >/dev/null 2>&1 || true
            docker rm test-container >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run \
            --name test-container \
            -p 127.0.0.1:8501:8501 \
            -d excel-audit-agent:ci

          # Poll the health endpoint from the runner host — the slim
          # application image has no curl, so the check must not run inside
          # the container.
          healthy=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then
              healthy="1"
              break
            fi
            sleep 2
          done

          if [ -z "$healthy" ]; then
            echo "Container never became healthy on http://127.0.0.1:8501/_stcore/health"
            exit 1
          fi

          echo "✓ Container started and health endpoint responded"
